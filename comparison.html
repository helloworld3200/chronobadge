<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparison Light/Dark</title>
    <style>
        body {
            font-family: system-ui, Arial, sans-serif;
            margin: 20px;
        }

        .comparison-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .light-badge {
            background-color: #f0f0f0;
            color: #000;
        }
        .dark-badge {
            background-color: #333;
            color: #fff;
        }

        .badge {
            width: 100%;
            height: 100%;
            padding: 100px;
        }
    </style>
</head>
<body>
    <h1>Badge Comparison Light/Dark</h1>
     
    <div class="comparison-container">
        <div class="badge light-badge">
            <img src="out/badge.png" alt="Light Badge">
        </div>
        <div class="badge dark-badge">
            <img src="out/badge.png" alt="Dark Badge">
        </div>
    </div>

</body>
</html>
